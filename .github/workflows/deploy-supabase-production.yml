name: Deploy Supabase production

on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: supabase-production
  cancel-in-progress: false

jobs:
  repository-gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.7.14
      - run: npm ci
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npx vitest run --no-file-parallelism
      - run: npx playwright test tests/e2e/support-payment.spec.ts tests/e2e/support-recovery.spec.ts tests/e2e/support-restore.spec.ts
      - run: deno test --allow-env --config supabase/functions/deno.json supabase/functions/tests
      - run: npx supabase@2.114.0 db start
      - run: npx supabase@2.114.0 db reset --local --no-seed
      - run: npx supabase@2.114.0 test db
      - run: npx supabase@2.114.0 migration list --local
      - run: npx supabase@2.114.0 db lint --local

  deploy-production:
    needs: repository-gates
    runs-on: ubuntu-latest
    environment: production
    env:
      CUMPA_DEPLOYMENT_ENVIRONMENT: production
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_GITHUB_CLIENT_SECRET: ${{ secrets.SUPABASE_GITHUB_CLIENT_SECRET }}
      STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
      STRIPE_WEBHOOK_SECRET: ${{ secrets.STRIPE_WEBHOOK_SECRET }}
      SUPPORT_PROVIDER_MODE: ${{ vars.SUPPORT_PROVIDER_MODE }}
      SUPABASE_GITHUB_CLIENT_ID: ${{ vars.SUPABASE_GITHUB_CLIENT_ID }}
      STRIPE_PRICE_ID: ${{ vars.STRIPE_PRICE_ID }}
      STRIPE_WEBHOOK_ENDPOINT_ID: ${{ vars.STRIPE_WEBHOOK_ENDPOINT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci
      - name: Guard canonical Supabase target
        run: |
          [[ "$SUPABASE_PROJECT_REF" =~ ^[a-z0-9]{20}$ ]] || exit 1
      - name: Deploy guarded Supabase release
        run: |
          acceptance=.planning/phases/02-move-the-implementation-to-supabase/02-09-ACCEPTANCE-EVIDENCE.md
          args=(--run-deployment --mode "$SUPPORT_PROVIDER_MODE" --evidence supabase-deployment-evidence.json)
          if [ "$SUPPORT_PROVIDER_MODE" = prelaunch-test ] && [ -f "$acceptance" ]; then
            args+=(--acceptance "$acceptance")
          elif [ "$SUPPORT_PROVIDER_MODE" != production-live ]; then
            exit 1
          fi
          node scripts/verify-supabase-support.mjs "${args[@]}"
      - name: Build configured release package
        run: |
          [[ "$SUPABASE_PROJECT_REF" =~ ^[a-z0-9]{20}$ ]] || exit 1
          origin="https://${SUPABASE_PROJECT_REF}.supabase.co"
          CUMPA_RELEASE_SUPPORT_SERVICE_URL="$origin" npm run build
          node scripts/verify-production-artifacts.mjs --expected-support-origin "$origin" --require-configured-launcher dist/bin/cumpa.mjs
          mkdir release-package
          npm pack --json --ignore-scripts --pack-destination release-package > release-package.json
      - uses: actions/upload-artifact@v4
        with:
          name: supabase-production-release-${{ github.run_id }}
          path: supabase-deployment-evidence.json
          if-no-files-found: error
          retention-days: 90
