services:
  - type: web
    name: cumpa-support
    runtime: node
    rootDir: services/support
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /healthz
    envVars:
      - key: NODE_VERSION
        value: 24
      - key: DATABASE_URL
        fromDatabase:
          name: cumpa-support-db
          property: connectionString
      - key: EMAIL_LOOKUP_HMAC_KEY
        generateValue: true
      - key: RECOVERY_TOKEN_HMAC_KEY
        generateValue: true
      - key: PUBLIC_BASE_URL
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: EMAIL_FROM
        sync: false
      - key: STRIPE_API_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      - key: STRIPE_PRICE_ID
        sync: false
      - key: STRIPE_PAYMENT_LINK_ID
        sync: false
databases:
  - name: cumpa-support-db
    databaseName: cumpa_support
    user: cumpa_support
